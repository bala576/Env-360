<div class="login-page">
  <div class="login-card">
    <app-brand-panel></app-brand-panel>

    <section class="form-panel">
      <div class="form-box">
      <span class="form-logo" role="img" aria-label="PurpleIQ"></span>
      <h2 class="form-title">Welcome to Purple IQ</h2>



      <form (ngSubmit)="login()" method="post" class="login-form">
        <label class="field">
          <span class="field-label">Email Address</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="M3 7l9 6 9-6" />
            </svg>
            <input
              type="email"
              [(ngModel)]="credentials.email"
              name="email"
              placeholder="rex@company.com"
              autocomplete="username"
            />
          </span>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <span class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V8a4 4 0 0 1 8 0v3" />
            </svg>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="credentials.password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
                <path d="M4 4l16 16" />
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </span>
        </label>

        <div class="form-meta">
          <label class="remember">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            Remember me
          </label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <p *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</p>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner" aria-hidden="true"></span>
          {{ isLoading ? 'Signing In...' : 'Sign In' }}
        </button>

        <div class="divider"><span>or continue with</span></div>

        <button type="button" class="btn-social" (click)="socialLogin('Google')">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z" />
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z" />
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z" />
          </svg>
          Sign in with Google
        </button>

        <button type="button" class="btn-social" (click)="socialLogin('Microsoft')">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="2" width="9.5" height="9.5" fill="#F25022" />
            <rect x="12.5" y="2" width="9.5" height="9.5" fill="#7FBA00" />
            <rect x="2" y="12.5" width="9.5" height="9.5" fill="#00A4EF" />
            <rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#FFB900" />
          </svg>
          Sign in with Microsoft
        </button>

        <p class="footer-note">
          Don't have an account? <a class="link" href="#">Contact your administrator</a>
        </p>

        <div *ngIf="popupVisible" class="popup-overlay">
          <div class="popup-card" [class.error]="popupType === 'error'" [class.success]="popupType === 'success'">
            <div class="popup-header">
              <h3>{{ popupTitle }}</h3>
              <button type="button" class="popup-close" (click)="closePopup()">×</button>
            </div>
            <div class="popup-body">
              <p>{{ popupMessage }}</p>
            </div>
            <div class="popup-actions">
              <button type="button" class="btn-close" (click)="closePopup()">Close</button>
            </div>
          </div>
        </div>
      </form>
      </div>
    </section>
  </div>
</div>
