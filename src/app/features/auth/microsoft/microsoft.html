<div class="auth-page">
  <div class="auth-layout">
    <app-brand-panel></app-brand-panel>

    <section class="form-panel">
      <div class="form-box">
        <svg class="provider-logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="2" width="9.5" height="9.5" fill="#F25022" />
          <rect x="12.5" y="2" width="9.5" height="9.5" fill="#7FBA00" />
          <rect x="2" y="12.5" width="9.5" height="9.5" fill="#00A4EF" />
          <rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#FFB900" />
        </svg>

        <h2>Sign in with Microsoft</h2>
        <p class="form-subtitle">Continue to Environment360</p>

        <div class="account-list">
          @for (account of accounts; track account.email) {
            <button
              type="button"
              class="account-row"
              [class.loading]="selectedEmail === account.email"
              [disabled]="!!selectedEmail"
              (click)="selectAccount(account)"
            >
              <span class="avatar">{{ initial(account.name) }}</span>
              <span class="account-info">
                <span class="account-name">{{ account.name }}</span>
                <span class="account-email">{{ account.email }}</span>
              </span>
              @if (selectedEmail === account.email) {
                <span class="spinner" aria-hidden="true"></span>
              } @else {
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 6l6 6-6 6" />
                </svg>
              }
            </button>
          }

          <button type="button" class="account-row" [disabled]="!!selectedEmail" (click)="useAnotherAccount()">
            <span class="avatar avatar-outline">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <circle cx="12" cy="10" r="3.5" />
                <path d="M5.5 18.5c1.5-2.5 3.8-3.5 6.5-3.5s5 1 6.5 3.5" />
              </svg>
            </span>
            <span class="account-info">
              <span class="account-name">Use another account</span>
            </span>
          </button>
        </div>

        <p class="terms">
          By continuing, you agree to Purple IQ's
          <a class="link" href="#">Terms of Service</a> and <a class="link" href="#">Privacy Policy</a>.
        </p>

        <a class="back-link" routerLink="/login">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
          Back to sign in
        </a>
      </div>
    </section>
  </div>
</div>
