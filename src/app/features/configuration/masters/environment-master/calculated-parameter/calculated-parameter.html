<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Calculated Parameter Master"
    searchPlaceholder="Search Calculated Parameters"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Calculated Parameter' : 'Add Calculated Parameter'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Parameter Code</label>
        <input type="text" formControlName="code" placeholder="e.g. HEAT-IDX" />
      </div>

      <div class="field">
        <label>Parameter Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Heat Index" />
      </div>

      <div class="field">
        <label>Output Unit</label>
        <input type="text" formControlName="outputUnit" placeholder="e.g. °C" />
      </div>

      <div class="field">
        <label>Environment Category</label>
        <div class="reference-field-row">
          <select formControlName="environmentCategory">
            <option value="" disabled>Select category</option>
            <option *ngFor="let c of environmentCategories" [value]="c">{{ c }}</option>
          </select>
          <button class="master-icon-btn" type="button" aria-label="add category" (click)="addCategory()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <button class="master-icon-btn" type="button" aria-label="edit category" [disabled]="isEditCategoryDisabled()" (click)="editCategory()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label>Input Parameters</label>
        <input type="text" formControlName="inputParameters" placeholder="e.g. Temperature, Humidity" />
      </div>

      <div class="field">
        <label>Formula Type</label>
        <select formControlName="formulaType">
          <option *ngFor="let t of formulaTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="field span-2">
        <label>Formula</label>
        <input type="text" formControlName="formula" placeholder="e.g. (Temp - 32) * 5/9" />
      </div>

      <div class="field">
        <label>Calculation Frequency</label>
        <input type="text" formControlName="calculationFrequency" placeholder="e.g. Every 5 min" />
      </div>

      <div class="field">
        <label>Aggregation Method</label>
        <select formControlName="aggregationMethod">
          <option *ngFor="let a of aggregationMethods" [value]="a">{{ a }}</option>
        </select>
      </div>

      <div class="field">
        <label>Minimum Valid Inputs</label>
        <input type="number" formControlName="minimumValidInputs" />
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

      <div class="field span-2">
        <label>Validity Condition</label>
        <input type="text" formControlName="validityCondition" placeholder="e.g. Humidity BETWEEN 0 AND 100" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
