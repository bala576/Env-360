<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Parameter Group Master"
    searchPlaceholder="Search Parameter Groups"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Parameter Group' : 'Add Parameter Group'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Parameter Group Code</label>
        <input type="text" formControlName="code" placeholder="e.g. PG-CLIMATE" />
      </div>

      <div class="field">
        <label>Parameter Group Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Climate Group" />
      </div>

      <div class="field">
        <label>Environment Category</label>
        <select formControlName="environmentCategory">
          <option value="" disabled>Select category</option>
          <option *ngFor="let c of environmentCategories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="field">
        <label>Environment Type</label>
        <input type="text" formControlName="environmentType" placeholder="e.g. Indoor Air" />
      </div>

      <div class="field">
        <label>Primary Parameter</label>
        <input type="text" formControlName="primaryParameter" placeholder="e.g. Temperature" />
      </div>

      <div class="field">
        <label>Default Unit</label>
        <input type="text" formControlName="defaultUnit" placeholder="e.g. Celsius" />
      </div>

      <div class="field span-2">
        <label>Parameters</label>
        <textarea formControlName="parameters" rows="2" placeholder="Comma separated, e.g. Temperature, Humidity"></textarea>
      </div>

      <div class="field span-2">
        <label>Secondary Parameters</label>
        <textarea formControlName="secondaryParameters" rows="2" placeholder="Comma separated"></textarea>
      </div>

      <div class="field">
        <label>Default Sampling Interval</label>
        <input type="text" formControlName="defaultSamplingInterval" placeholder="e.g. 5 min" />
      </div>

      <div class="field">
        <label>Default Aggregation</label>
        <select formControlName="defaultAggregation">
          <option *ngFor="let a of aggregationMethods" [value]="a">{{ a }}</option>
        </select>
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
