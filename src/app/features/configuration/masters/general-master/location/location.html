<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Location Type Master"
    searchPlaceholder="Search Location Types"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Location Type' : 'Add Location Type'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Location Type Code</label>
        <input type="text" formControlName="code" placeholder="e.g. LT-BLD" />
      </div>

      <div class="field">
        <label>Location Type Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Building" />
      </div>

      <div class="field">
        <label>Parent Location Type</label>
        <select formControlName="parentLocationType">
          <option value="">None</option>
          <option *ngFor="let loc of parentOptions" [value]="loc.name">{{ loc.name }}</option>
        </select>
      </div>

      <div class="field">
        <label>Color / Marker</label>
        <input type="color" formControlName="color" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Icon</label>
        <input type="text" formControlName="icon" placeholder="Icon name / URL" />
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

      <div class="field">
        <label>Allows Monitoring Points</label>
        <app-form-toggle formControlName="allowsMonitoringPoints" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Allows Devices</label>
        <app-form-toggle formControlName="allowsDevices" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
