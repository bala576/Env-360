<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Monitoring Point Type Master"
    searchPlaceholder="Search Monitoring Point Types"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Monitoring Point Type' : 'Add Monitoring Point Type'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Monitoring Point Type Code</label>
        <input type="text" formControlName="code" placeholder="e.g. MPT-AIR" />
      </div>

      <div class="field">
        <label>Monitoring Point Type Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Ambient Air Monitoring" />
      </div>

      <div class="field">
        <label>Environment Category</label>
        <select formControlName="environmentCategory">
          <option value="" disabled>Select category</option>
          <option *ngFor="let c of environmentCategories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="field">
        <label>Environment Type</label>
        <input type="text" formControlName="environmentType" placeholder="e.g. Indoor Air" />
      </div>

      <div class="field">
        <label>Default Parameter Group</label>
        <input type="text" formControlName="defaultParameterGroup" placeholder="e.g. Climate" />
      </div>

      <div class="field">
        <label>Expected Sensor Types</label>
        <input type="text" formControlName="expectedSensorTypes" placeholder="e.g. Temperature, Humidity" />
      </div>

      <div class="field">
        <label>Criticality</label>
        <select formControlName="criticality">
          <option *ngFor="let c of criticalityLevels" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="field">
        <label>Indoor / Outdoor</label>
        <select formControlName="indoorOutdoor">
          <option *ngFor="let o of indoorOutdoorOptions" [value]="o">{{ o }}</option>
        </select>
      </div>

      <div class="field">
        <label>Icon</label>
        <input type="text" formControlName="icon" placeholder="Icon name / URL" />
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
