<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Organization Master"
    searchPlaceholder="Search Organizations"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Organization' : 'Add Organization'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Organization Code</label>
        <input type="text" formControlName="code" placeholder="e.g. ENV-HQ" />
      </div>

      <div class="field">
        <label>Organization Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Environment 360 HQ" />
      </div>

      <div class="field">
        <label>Organization Type</label>
        <select formControlName="type">
          <option value="" disabled>Select type</option>
          <option *ngFor="let t of orgTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="field">
        <label>Parent Organization</label>
        <select formControlName="parentOrganization">
          <option value="">None</option>
          <option *ngFor="let org of parentOptions" [value]="org.name">{{ org.name }}</option>
        </select>
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2" placeholder="Short description"></textarea>
      </div>

      <div class="field">
        <label>Logo</label>
        <input type="text" formControlName="logo" placeholder="Logo URL" />
      </div>

      <div class="field">
        <label>Country</label>
        <select formControlName="country">
          <option value="" disabled>Select country</option>
          <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="field">
        <label>Time Zone</label>
        <select formControlName="timeZone">
          <option value="" disabled>Select time zone</option>
          <option *ngFor="let tz of timeZones" [value]="tz">{{ tz }}</option>
        </select>
      </div>

      <div class="field">
        <label>Default Currency</label>
        <select formControlName="defaultCurrency">
          <option value="" disabled>Select currency</option>
          <option *ngFor="let cur of currencies" [value]="cur">{{ cur }}</option>
        </select>
      </div>

      <div class="field">
        <label>Contact Person</label>
        <input type="text" formControlName="contactPerson" />
      </div>

      <div class="field">
        <label>Contact Email</label>
        <input type="email" formControlName="contactEmail" />
      </div>

      <div class="field">
        <label>Contact Phone</label>
        <input type="text" formControlName="contactPhone" />
      </div>

      <div class="field span-2">
        <label>Address</label>
        <textarea formControlName="address" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

      <div class="field">
        <label>Effective From</label>
        <input type="date" formControlName="effectiveFrom" />
      </div>

      <div class="field">
        <label>Effective To</label>
        <input type="date" formControlName="effectiveTo" />
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
