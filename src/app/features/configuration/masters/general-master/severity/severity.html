<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Severity Master"
    searchPlaceholder="Search Severities"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Severity' : 'Add Severity'"
    (closed)="cancel()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Severity Code</label>
        <input type="text" formControlName="code" placeholder="e.g. CRIT" />
      </div>

      <div class="field">
        <label>Severity Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Critical" />
      </div>

      <div class="field">
        <label>Priority</label>
        <input type="number" formControlName="priority" />
      </div>

      <div class="field">
        <label>Color</label>
        <input type="color" formControlName="color" />
      </div>

      <div class="field">
        <label>Icon</label>
        <input type="text" formControlName="icon" placeholder="Icon name / URL" />
      </div>

      <div class="field">
        <label>SLA Minutes</label>
        <input type="number" formControlName="slaMinutes" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Acknowledgement Required</label>
        <app-form-toggle formControlName="acknowledgementRequired" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Escalation Required</label>
        <app-form-toggle formControlName="escalationRequired" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="cancel()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
