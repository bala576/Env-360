<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Unit Master"
    searchPlaceholder="Search Units"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Unit' : 'Add Unit'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Unit Code</label>
        <input type="text" formControlName="code" placeholder="e.g. CEL" />
      </div>

      <div class="field">
        <label>Unit Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Celsius" />
      </div>

      <div class="field">
        <label>Symbol</label>
        <input type="text" formControlName="symbol" placeholder="e.g. °C" />
      </div>

      <div class="field">
        <label>Measurement Type</label>
        <select formControlName="measurementType">
          <option value="" disabled>Select type</option>
          <option *ngFor="let t of measurementTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="field">
        <label>Base Unit</label>
        <input type="text" formControlName="baseUnit" placeholder="e.g. Celsius" />
      </div>

      <div class="field">
        <label>Conversion Type</label>
        <select formControlName="conversionType">
          <option *ngFor="let t of conversionTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="field span-2">
        <label>Conversion Formula</label>
        <input type="text" formControlName="conversionFormula" placeholder="e.g. (x*9/5)+32" />
      </div>

      <div class="field">
        <label>Decimal Precision</label>
        <input type="number" formControlName="decimalPrecision" />
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

      <div class="field">
        <label>Minimum Display Value</label>
        <input type="number" formControlName="minimumDisplayValue" />
      </div>

      <div class="field">
        <label>Maximum Display Value</label>
        <input type="number" formControlName="maximumDisplayValue" />
      </div>

      <div class="field">
        <label>SI Unit</label>
        <app-form-toggle formControlName="siUnit" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
