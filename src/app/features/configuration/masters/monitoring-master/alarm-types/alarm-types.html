<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Alarm Type Master"
    searchPlaceholder="Search Alarm Types"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Alarm Type' : 'Add Alarm Type'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Alarm Code</label>
        <input type="text" formControlName="code" placeholder="e.g. ALM-HTEMP" />
      </div>

      <div class="field">
        <label>Alarm Name</label>
        <input type="text" formControlName="name" placeholder="e.g. High Temperature Alarm" />
      </div>

      <div class="field">
        <label>Alarm Category</label>
        <input type="text" formControlName="alarmCategory" placeholder="e.g. Threshold Breach" />
      </div>

      <div class="field">
        <label>Environment Category</label>
        <select formControlName="environmentCategory">
          <option value="" disabled>Select category</option>
          <option *ngFor="let c of environmentCategories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="field">
        <label>Parameter</label>
        <input type="text" formControlName="parameter" placeholder="e.g. Temperature" />
      </div>

      <div class="field">
        <label>Default Severity</label>
        <div class="reference-field-row">
          <select formControlName="defaultSeverity">
            <option *ngFor="let s of severities" [value]="s">{{ s }}</option>
          </select>
          <button class="master-icon-btn" type="button" aria-label="add severity" (click)="addSeverity()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <button class="master-icon-btn" type="button" aria-label="edit severity" [disabled]="isEditSeverityDisabled()" (click)="editSeverity()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label>Trigger Type</label>
        <select formControlName="triggerType">
          <option *ngFor="let t of triggerTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="field">
        <label>SLA</label>
        <input type="text" formControlName="sla" placeholder="e.g. 15 min" />
      </div>

      <div class="field">
        <label>Default Notification Profile</label>
        <input type="text" formControlName="defaultNotificationProfile" placeholder="e.g. Critical Alert Profile" />
      </div>

      <div class="field">
        <label>Auto Clear Duration</label>
        <input type="text" formControlName="autoClearDuration" placeholder="e.g. 10 min" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Acknowledgement Required</label>
        <app-form-toggle formControlName="acknowledgementRequired" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Auto Clear Enabled</label>
        <app-form-toggle formControlName="autoClearEnabled" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
