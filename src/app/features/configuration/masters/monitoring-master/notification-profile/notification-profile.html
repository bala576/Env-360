<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Notification Profile Master"
    searchPlaceholder="Search Notification Profiles"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Notification Profile' : 'Add Notification Profile'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Profile Code</label>
        <input type="text" formControlName="code" placeholder="e.g. NTP-GAS-CRIT" />
      </div>

      <div class="field">
        <label>Profile Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Critical Gas Alarm Notification" />
      </div>

      <div class="field">
        <label>Alarm Severity</label>
        <select formControlName="alarmSeverity">
          <option value="" disabled>Select severity</option>
          <option *ngFor="let s of alarmSeverities" [value]="s">{{ s }}</option>
        </select>
      </div>

      <div class="field">
        <label>Notification Channels</label>
        <input type="text" formControlName="notificationChannels" placeholder="e.g. Email, SMS, Push" />
      </div>

      <div class="field">
        <label>Primary Recipient Type</label>
        <select formControlName="primaryRecipientType">
          <option value="" disabled>Select type</option>
          <option *ngFor="let t of recipientTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="field">
        <label>Primary Recipients</label>
        <input type="text" formControlName="primaryRecipients" placeholder="e.g. site-admins@env360.com" />
      </div>

      <div class="field">
        <label>Escalation Enabled</label>
        <app-form-toggle formControlName="escalationEnabled" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Escalation Level</label>
        <input type="text" formControlName="escalationLevel" placeholder="e.g. Level 2" />
      </div>

      <div class="field">
        <label>Escalation Recipient</label>
        <input type="text" formControlName="escalationRecipient" placeholder="e.g. ops-manager@env360.com" />
      </div>

      <div class="field">
        <label>Escalation Delay</label>
        <input type="text" formControlName="escalationDelay" placeholder="e.g. 10 min" />
      </div>

      <div class="field">
        <label>Repeat Notification</label>
        <app-form-toggle formControlName="repeatNotification" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Repeat Interval</label>
        <input type="text" formControlName="repeatInterval" placeholder="e.g. 30 min" />
      </div>

      <div class="field">
        <label>Maximum Attempts</label>
        <input type="number" formControlName="maximumAttempts" />
      </div>

      <div class="field">
        <label>Acknowledgement Required</label>
        <app-form-toggle formControlName="acknowledgementRequired" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Business Hours Only</label>
        <app-form-toggle formControlName="businessHoursOnly" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Quiet Hours</label>
        <input type="text" formControlName="quietHours" placeholder="e.g. 22:00 - 06:00" />
      </div>

      <div class="field">
        <label>Email Template</label>
        <input type="text" formControlName="emailTemplate" placeholder="e.g. critical-alert-email-v1" />
      </div>

      <div class="field">
        <label>SMS Template</label>
        <input type="text" formControlName="smsTemplate" placeholder="e.g. critical-alert-sms-v1" />
      </div>

      <div class="field">
        <label>Push Template</label>
        <input type="text" formControlName="pushTemplate" placeholder="e.g. critical-alert-push-v1" />
      </div>

      <div class="field">
        <label>Webhook</label>
        <input type="text" formControlName="webhook" placeholder="Webhook URL" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
