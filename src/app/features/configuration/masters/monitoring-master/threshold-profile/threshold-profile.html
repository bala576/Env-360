<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Threshold Profile Master"
    searchPlaceholder="Search Threshold Profiles"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Threshold Profile' : 'Add Threshold Profile'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Profile Code</label>
        <input type="text" formControlName="code" placeholder="e.g. THP-TEMP" />
      </div>

      <div class="field">
        <label>Profile Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Temperature Threshold" />
      </div>

      <div class="field">
        <label>Environment Type</label>
        <input type="text" formControlName="environmentType" placeholder="e.g. Indoor Air Quality" />
      </div>

      <div class="field">
        <label>Parameter</label>
        <input type="text" formControlName="parameter" placeholder="e.g. Temperature" />
      </div>

      <div class="field">
        <label>Unit</label>
        <input type="text" formControlName="unit" placeholder="e.g. °C" />
      </div>

      <div class="field">
        <label>Version</label>
        <input type="text" formControlName="version" placeholder="e.g. v1.0" />
      </div>

      <div class="field">
        <label>Normal Lower Limit</label>
        <input type="number" formControlName="normalLowerLimit" />
      </div>

      <div class="field">
        <label>Normal Upper Limit</label>
        <input type="number" formControlName="normalUpperLimit" />
      </div>

      <div class="field">
        <label>Warning Lower Limit</label>
        <input type="number" formControlName="warningLowerLimit" />
      </div>

      <div class="field">
        <label>Warning Upper Limit</label>
        <input type="number" formControlName="warningUpperLimit" />
      </div>

      <div class="field">
        <label>Critical Lower Limit</label>
        <input type="number" formControlName="criticalLowerLimit" />
      </div>

      <div class="field">
        <label>Critical Upper Limit</label>
        <input type="number" formControlName="criticalUpperLimit" />
      </div>

      <div class="field">
        <label>Trigger Duration</label>
        <input type="text" formControlName="triggerDuration" placeholder="e.g. 5 min" />
      </div>

      <div class="field">
        <label>Clear Duration</label>
        <input type="text" formControlName="clearDuration" placeholder="e.g. 2 min" />
      </div>

      <div class="field">
        <label>Hysteresis</label>
        <input type="number" formControlName="hysteresis" />
      </div>

      <div class="field">
        <label>Rate of Change Limit</label>
        <input type="text" formControlName="rateOfChangeLimit" placeholder="e.g. 2°C/min" />
      </div>

      <div class="field">
        <label>Schedule</label>
        <input type="text" formControlName="schedule" placeholder="e.g. 24x7" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
