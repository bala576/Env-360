<div class="master-page">

  <app-breadcrumb [items]="breadcrumb"></app-breadcrumb>

  <app-generic-table
    title="Sensor Type Master"
    searchPlaceholder="Search Sensor Types"
    [columns]="columns"
    [rows]="rows"
    (add)="openAdd()"
    (edit)="openEdit($event)"
    (delete)="deleteRow($event)"
  ></app-generic-table>

  <app-generic-popup
    [isOpen]="popupOpen"
    [title]="editingRow ? 'Edit Sensor Type' : 'Add Sensor Type'"
    (closed)="closePopup()"
  >
    <form [formGroup]="form" class="master-form">

      <div class="field">
        <label>Sensor Type Code</label>
        <input type="text" formControlName="code" placeholder="e.g. SNT-TH" />
      </div>

      <div class="field">
        <label>Sensor Type Name</label>
        <input type="text" formControlName="name" placeholder="e.g. Temperature & Humidity Sensor" />
      </div>

      <div class="field">
        <label>Sensor Category</label>
        <input type="text" formControlName="sensorCategory" placeholder="e.g. Gas Sensor" />
      </div>

      <div class="field">
        <label>Environment Category</label>
        <select formControlName="environmentCategory">
          <option value="" disabled>Select category</option>
          <option *ngFor="let c of environmentCategories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="field">
        <label>Measurement Principle</label>
        <input type="text" formControlName="measurementPrinciple" placeholder="e.g. NDIR" />
      </div>

      <div class="field">
        <label>Measurement Range</label>
        <input type="text" formControlName="measurementRange" placeholder="e.g. 0-5000 ppm" />
      </div>

      <div class="field">
        <label>Accuracy</label>
        <input type="text" formControlName="accuracy" placeholder="e.g. ±0.5°C" />
      </div>

      <div class="field">
        <label>Resolution</label>
        <input type="text" formControlName="resolution" placeholder="e.g. 0.1°C" />
      </div>

      <div class="field">
        <label>Response Time</label>
        <input type="text" formControlName="responseTime" placeholder="e.g. 30s" />
      </div>

      <div class="field">
        <label>Sampling Capability</label>
        <input type="text" formControlName="samplingCapability" placeholder="e.g. Continuous" />
      </div>

      <div class="field">
        <label>Calibration Required</label>
        <app-form-toggle formControlName="calibrationRequired" [onValue]="true" [offValue]="false" onLabel="Yes" offLabel="No"></app-form-toggle>
      </div>

      <div class="field">
        <label>Calibration Interval</label>
        <input type="text" formControlName="calibrationInterval" placeholder="e.g. 6 months" />
      </div>

      <div class="field">
        <label>Indoor / Outdoor</label>
        <select formControlName="indoorOutdoor">
          <option *ngFor="let o of indoorOutdoorOptions" [value]="o">{{ o }}</option>
        </select>
      </div>

      <div class="field">
        <label>IP Rating</label>
        <input type="text" formControlName="ipRating" placeholder="e.g. IP67" />
      </div>

      <div class="field">
        <label>Operating Temperature</label>
        <input type="text" formControlName="operatingTemperature" placeholder="e.g. -40 to 85 °C" />
      </div>

      <div class="field">
        <label>Operating Humidity</label>
        <input type="text" formControlName="operatingHumidity" placeholder="e.g. 0-100% RH" />
      </div>

      <div class="field">
        <label>Power Type</label>
        <input type="text" formControlName="powerType" placeholder="e.g. Battery" />
      </div>

      <div class="field">
        <label>Display Order</label>
        <input type="number" formControlName="displayOrder" />
      </div>

      <div class="field span-2">
        <label>Supported Parameters</label>
        <input type="text" formControlName="supportedParameters" placeholder="e.g. Temperature, Humidity" />
      </div>

      <div class="field span-2">
        <label>Description</label>
        <textarea formControlName="description" rows="2"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <app-form-toggle formControlName="status"></app-form-toggle>
      </div>

    </form>

    <ng-container popupFooter>
      <button class="btn-secondary" type="button" (click)="closePopup()">Cancel</button>
      <button class="btn-primary" type="button" (click)="save()">Save</button>
    </ng-container>
  </app-generic-popup>

</div>
