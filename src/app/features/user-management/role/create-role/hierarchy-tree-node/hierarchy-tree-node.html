<div class="hierarchy-row" [style.paddingLeft.px]="depth * 20">
  <button
    type="button"
    class="chevron-btn"
    [class.hidden]="!node.children.length"
    (click)="toggleExpand()"
  >
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" [class.open]="node.expanded">
      <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <label class="hierarchy-checkbox">
    <input type="checkbox" [checked]="isChecked" (change)="onCheck()" />
    {{ node.name }}
  </label>
</div>

<div class="hierarchy-children" *ngIf="node.expanded && node.children.length">
  <app-hierarchy-tree-node
    *ngFor="let child of node.children"
    [node]="child"
    [depth]="depth + 1"
    [selectedIds]="selectedIds"
    (toggle)="onChildToggle($event)"
  ></app-hierarchy-tree-node>
</div>
