<div class="dd" [class.open]="open" [class.disabled]="disabled">
  <button
    type="button"
    class="dd-trigger"
    [disabled]="disabled"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="dd-label" [class.placeholder]="!selected">{{ selected?.label ?? placeholder }}</span>
    <svg class="dd-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  @if (open) {
    <ul class="dd-menu" role="listbox">
      @for (option of options; track $index) {
        <li
          role="option"
          class="dd-option"
          [class.selected]="option.value === value"
          [class.active]="$index === activeIndex"
          [class.disabled]="option.disabled"
          [attr.aria-selected]="option.value === value"
          (mouseenter)="activeIndex = $index"
          (click)="select(option)"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </li>
      }
    </ul>
  }
</div>
