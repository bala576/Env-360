<aside class="sidebar" [class.collapsed]="isCollapsed">

  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-badge">
        <img class="logo-icon" src="/assets/env360-mark.png" alt="Environment 360 Logo" />
      </span>
      <span class="logo-text" *ngIf="!isCollapsed">
        <span class="logo-name">Environment<span class="logo-accent">360<svg class="logo-ring" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="logoRingGrad" x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0" stop-color="#34d399"/>
                <stop offset="0.5" stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
              <linearGradient id="logoLeafGrad" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#10b981"/>
                <stop offset="1" stop-color="#6ee7b7"/>
              </linearGradient>
            </defs>
            <path d="M6.68 14 A20 20 0 1 1 6.68 34" fill="none" stroke="url(#logoRingGrad)" stroke-width="2" stroke-linecap="round"/>
            <g transform="translate(37 8.5)">
              <path d="M0 0 C-1.5 -4.5 0.5 -8.5 5 -10 C5.8 -5.5 4 -1.5 0 0 Z" fill="url(#logoLeafGrad)"/>
              <path d="M0 0 C3 -0.5 6.5 0.5 8.5 3.5 C5 4.5 2 3 0 0 Z" fill="url(#logoLeafGrad)" opacity="0.85"/>
            </g>
          </svg></span></span>
        <span class="logo-by">by Purple IQ</span>
      </span>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse()" aria-label="collapse sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" [class.rotated]="isCollapsed">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of navItems" class="nav-item">

        <ng-template #navContent>
          <span class="icon-wrap">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
              <path
                *ngFor="let d of navIcons[item.icon]"
                [attr.d]="d"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge && !isCollapsed">{{ item.badge }}</span>
          <span class="nav-dot" *ngIf="item.badge && isCollapsed"></span>
          <svg *ngIf="!isCollapsed && item.children" class="chevron" [class.open]="expandedItem === item.label" width="14" height="14" viewBox="0 0 24 24" fill="none"
            role="button" [attr.aria-label]="(expandedItem === item.label ? 'hide ' : 'show ') + item.label + ' menu'" [attr.aria-expanded]="expandedItem === item.label" (click)="toggleSubmenu(item, $event)">
            <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngIf="!isCollapsed && item.hasFlyout" class="chevron" [class.open]="adminPanelOpen" width="14" height="14" viewBox="0 0 24 24" fill="none"
            role="button" aria-label="show administration menu" (click)="toggleAdminPanel($event)">
            <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </ng-template>

        <div
          *ngIf="item.children"
          class="nav-link"
          role="button"
          tabindex="0"
          [class.active]="isNavItemActive(item)"
          [title]="isCollapsed ? item.label : ''"
          [attr.aria-expanded]="expandedItem === item.label"
          (click)="onParentClick(item)"
          (keydown.enter)="onParentClick(item)"
          (keydown.space)="onParentClick(item); $event.preventDefault()"
        >
          <ng-container *ngTemplateOutlet="navContent"></ng-container>
        </div>

        <a
          *ngIf="!item.hasFlyout && item.route && !item.children"
          [routerLink]="item.route"
          [class.active]="isNavItemActive(item)"
          [title]="isCollapsed ? item.label : ''"
          class="nav-link"
          (click)="closeAdminPanel()"
        >
          <ng-container *ngTemplateOutlet="navContent"></ng-container>
        </a>

        <ul class="nav-submenu" *ngIf="item.children && !isCollapsed && expandedItem === item.label">
          <li *ngFor="let child of item.children; let i = index" [style.--i]="i">
            <a
              [routerLink]="child.route"
              [queryParams]="child.tab ? { tab: child.tab } : null"
              [class.active]="isChildActive(item, child)"
              [attr.aria-current]="isChildActive(item, child) ? 'page' : null"
              (click)="closeAdminPanel()"
            >{{ child.label }}</a>
          </li>
        </ul>

        <div
          *ngIf="!item.hasFlyout && !item.route"
          class="nav-link"
          [title]="isCollapsed ? item.label : ''"
          (click)="closeAdminPanel()"
        >
          <ng-container *ngTemplateOutlet="navContent"></ng-container>
        </div>

        <div
          *ngIf="item.hasFlyout"
          class="nav-link parent"
          [class.active]="adminPanelOpen || isAdminActive"
          [title]="isCollapsed ? item.label : ''"
          (click)="onNavItemClick(item)"
        >
          <ng-container *ngTemplateOutlet="navContent"></ng-container>
        </div>
      </li>
    </ul>
  </nav>

  <svg class="sidebar-wave" viewBox="0 0 250 120" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#6d28d9"/>
      </linearGradient>
      <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8b5cf6"/>
        <stop offset="100%" stop-color="#5b21b6"/>
      </linearGradient>
      <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4c1d95"/>
        <stop offset="100%" stop-color="#5b21b6"/>
      </linearGradient>
    </defs>
    <path d="M0 18 C45 8 90 30 140 52 C185 72 220 44 250 30 V120 H0 Z" fill="url(#waveBack)" opacity="0.55"/>
    <path d="M0 40 C50 30 95 62 145 70 C195 78 225 52 250 46 V120 H0 Z" fill="url(#waveMid)" opacity="0.8"/>
    <path d="M0 78 C55 58 110 96 165 88 C205 82 230 66 250 70 V120 H0 Z" fill="url(#waveFront)"/>
  </svg>

  <!-- Administration flyout panel -->
  <div class="admin-flyout" *ngIf="adminPanelOpen">
    <div class="admin-flyout-header">
      <span>Administration</span>
      <button class="flyout-close" (click)="closeAdminPanel()" aria-label="close">×</button>
    </div>

    <ul class="admin-flyout-list">
      <li *ngFor="let section of adminSections">

        <a
          *ngIf="!section.children"
          [routerLink]="section.route"
          routerLinkActive="active"
          class="flyout-link"
          (click)="closeAdminPanel()"
        >
          <span class="icon-wrap" [ngSwitch]="section.icon">
            <svg *ngSwitchCase="'licence'" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M7 9h10M7 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span>{{ section.label }}</span>
        </a>

        <div
          *ngIf="section.children"
          class="flyout-link parent"
          [class.active]="expandedAdminSection === section.label"
          (click)="toggleAdminSection(section)"
        >
          <span class="icon-wrap" [ngSwitch]="section.icon">
            <svg *ngSwitchCase="'config'" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3h0a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5h0a1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9v0a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngSwitchCase="'users'" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="10" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>{{ section.label }}</span>
          <svg class="chevron" [class.open]="expandedAdminSection === section.label" width="13" height="13" viewBox="0 0 24 24" fill="none">
            <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <ul class="flyout-submenu" *ngIf="section.children && expandedAdminSection === section.label">
          <li *ngFor="let child of section.children">

            <a
              *ngIf="!child.children"
              [routerLink]="child.route"
              routerLinkActive="active"
              (click)="closeAdminPanel()"
            >
              <span>{{ child.label }}</span>
              <svg *ngIf="child.addIcon" class="add-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </a>

            <div
              *ngIf="child.children"
              class="flyout-subgroup"
              [class.active]="expandedConfigGroup === child.label"
              (click)="toggleConfigGroup(child)"
            >
              <span>{{ child.label }}</span>
              <svg class="chevron" [class.open]="expandedConfigGroup === child.label" width="12" height="12" viewBox="0 0 24 24" fill="none">
                <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <ul class="flyout-subsubmenu" *ngIf="child.children && expandedConfigGroup === child.label">
              <li *ngFor="let grandchild of child.children">
                <a [routerLink]="grandchild.route" routerLinkActive="active" (click)="closeAdminPanel()">
                  <span>{{ grandchild.label }}</span>
                </a>
              </li>
            </ul>

          </li>
        </ul>
      </li>
    </ul>
  </div>
</aside>
