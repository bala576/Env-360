<header class="topbar">
  <div class="topbar-left">
    <h1 class="page-title">{{ pageTitle }}</h1>
  </div>

  <div class="topbar-right">
    <button class="icon-btn" aria-label="mail">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M3 6l9 6 9-6M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="notif-wrapper">
      <button class="icon-btn" [class.active]="notificationsOpen" aria-label="notifications" (click)="toggleNotifications()">
        <svg class="bell-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M18 8a6 6 0 10-12 0c0 3.5-1 5-2 7h16c-1-2-2-3.5-2-7z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 18a2.5 2.5 0 005 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="badge" *ngIf="unreadCount > 0" animate.leave="badge-leave">{{ unreadCount }}</span>
      </button>

      <div class="notif-panel" *ngIf="notificationsOpen" animate.leave="panel-leave">
        <div class="notif-header">
          <h3>Notifications ({{ notifications.length }})</h3>
          <div class="notif-actions">
            <button class="mark-read-btn" (click)="markAllAsRead()" [disabled]="unreadCount === 0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 12.5l2.5 2.5L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Mark all as read
            </button>
            <a class="settings-btn" routerLink="/administration/configuration/masters/monitoring-master/notification-profile" aria-label="notification settings" (click)="notificationsOpen = false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </div>

        <div class="notif-tabs">
          <button
            *ngFor="let tab of tabs"
            class="notif-tab"
            [class.active]="activeTab === tab.key"
            (click)="activeTab = tab.key">
            {{ tab.label }} ({{ tabCount(tab.key) }})
          </button>
        </div>

        <ul class="notif-list">
          <li
            *ngFor="let n of filteredNotifications"
            class="notif-item"
            [class.unread]="!n.read"
            (click)="markAsRead(n)">
            <div class="notif-icon" [ngClass]="'tone-' + n.tone">
              <ng-container [ngSwitch]="n.icon">
                <svg *ngSwitchCase="'warning'" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>
                  <path d="M12 9v4M12 17h.01" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                <svg *ngSwitchCase="'wrench'" width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" fill="currentColor"/>
                </svg>
                <svg *ngSwitchCase="'visitor'" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="7" r="3"/>
                  <circle cx="5" cy="9" r="2.2"/>
                  <circle cx="19" cy="9" r="2.2"/>
                  <path d="M6 19a6 6 0 0112 0v1H6v-1zM1 19a4 4 0 015.2-3.8A7.5 7.5 0 004.5 20H1v-1zM23 19a4 4 0 00-5.2-3.8 7.5 7.5 0 011.7 4.8H23v-1z"/>
                </svg>
                <svg *ngSwitchCase="'asset'" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2l9 5v10l-9 5-9-5V7l9-5z" opacity="0.85"/>
                  <path d="M12 12l9-5M12 12L3 7M12 12v10" stroke="#fff" stroke-width="1.4" fill="none"/>
                </svg>
                <svg *ngSwitchDefault width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19.4 13a7.5 7.5 0 000-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 00-1.7-1l-.4-2.6h-4l-.4 2.6a7.6 7.6 0 00-1.7 1l-2.5-1-2 3.5L4.6 11a7.5 7.5 0 000 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 001.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 001.7-1l2.5 1 2-3.5L19.4 13zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/>
                </svg>
              </ng-container>
            </div>

            <div class="notif-body">
              <div class="notif-top">
                <span class="notif-title">{{ n.title }}</span>
                <span class="notif-time">{{ n.time }}</span>
              </div>
              <p class="notif-message">{{ n.message }}</p>
            </div>

            <span class="unread-dot" *ngIf="!n.read"></span>
          </li>

          <li class="notif-empty" *ngIf="filteredNotifications.length === 0">
            No notifications
          </li>
        </ul>

        <button type="button" class="notif-footer" (click)="notificationsOpen = false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M14 3v5h5M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>View All Notifications</span>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="user-menu" [class.open]="userMenuOpen">
      <div class="user-trigger" (click)="toggleUserMenu()">
        <div class="avatar">{{ currentUser.initials }}</div>
        <div class="user-info">
          <span class="user-name">{{ currentUser.name }}</span>
          <span class="user-role">{{ currentUser.role }}</span>
        </div>
        <svg class="chevron" [class.open]="userMenuOpen" width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="user-panel" *ngIf="userMenuOpen" animate.leave="panel-leave">
        <div class="user-panel-header">
          <div class="user-panel-avatar">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="#ffffff">
              <circle cx="12" cy="8.5" r="4"/>
              <path d="M4 21a8 8 0 0116 0z" opacity="0.75"/>
            </svg>
          </div>
          <div>
            <div class="user-panel-name">{{ currentUser.name }}</div>
            <div class="user-panel-role">{{ currentUser.role }}</div>
          </div>
        </div>

        <div class="user-panel-section">
          <a class="menu-item" routerLink="/profile" (click)="userMenuOpen = false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20a8 8 0 0116 0v1H4z"/>
            </svg>
            <span class="menu-label">My Profile</span>
          </a>

          <a class="menu-item" routerLink="/administration/settings" (click)="userMenuOpen = false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="menu-label">Preferences</span>
          </a>

          <button type="button" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <span class="menu-label">Language</span>
            <span class="menu-value">{{ currentLanguage }}</span>
            <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="7" r="3"/>
              <circle cx="5" cy="9" r="2.2"/>
              <circle cx="19" cy="9" r="2.2"/>
              <path d="M6 19a6 6 0 0112 0v1H6v-1zM1 19a4 4 0 015.2-3.8A7.5 7.5 0 004.5 20H1v-1zM23 19a4 4 0 00-5.2-3.8 7.5 7.5 0 011.7 4.8H23v-1z"/>
            </svg>
            <span class="menu-label">Switch Tenant / Site</span>
            <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L2 7v2h20V7L12 2z"/>
              <path d="M4 11h2.5v7H4zM10.75 11h2.5v7h-2.5zM17.5 11H20v7h-2.5zM2 20h20v2H2z"/>
            </svg>
            <span class="menu-label">Organization Settings</span>
            <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
              <path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="17" r="1.1" fill="currentColor"/>
            </svg>
            <span class="menu-label">Help &amp; Support</span>
            <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="menu-item" (click)="hasWhatsNew = false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 2H7a2 2 0 00-2 2v16a2 2 0 002 2h10a2 2 0 002-2V7l-5-5zm-5 11h6v1.8H9V13zm0 3.6h6v1.8H9v-1.8zM13.5 8V3.5L18 8h-4.5z"/>
            </svg>
            <span class="menu-label">What's New</span>
            <span class="menu-dot" *ngIf="hasWhatsNew"></span>
          </button>

          <button type="button" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="menu-label">Documentation</span>
            <svg class="menu-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="user-panel-section user-panel-footer">
          <button type="button" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 10V7a5 5 0 00-10 0v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1zm-8 0V7a3 3 0 016 0v3H9z"/>
            </svg>
            <span class="menu-label">Change Password</span>
          </button>

          <button type="button" class="menu-item" (click)="logout()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M10 4H6a2 2 0 00-2 2v12a2 2 0 002 2h4M14 8l4 4-4 4M18 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="menu-label">Sign Out</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
